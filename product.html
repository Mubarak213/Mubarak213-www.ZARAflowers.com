<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Product Details</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="logo">
    ShopMart
  </div>

  <div class="actions">

    <a
      href="cart.html"
      class="btn"
    >

      Cart 🛒

      <span id="cart-count">
        0
      </span>

    </a>

  </div>

</header>

<!-- ================= PRODUCT DETAILS ================= -->

<section class="product-details-page">

  <div
    id="productDetails"
    class="product-details-container"
  ></div>

</section>

<!-- ================= SCRIPT ================= -->

<script src="script.js"></script>

<script>

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      updateCart();

      loadProductDetails();
    }
  );

</script>

</body>

</html>
