<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"

  />

</head>

    Zahra Garlands
  </div>

    <div class="search-bar">

        type="text"
        id="searchInput"
        placeholder="Search flowers, jadai, malai..."

      >

    </div>

    <!-- SEARCH SUGGESTIONS -->

    <div
      id="searchResults"
      class="search-results"
    ></div>

  </div>

  <!-- ACTIONS -->

  <div class="actions">

    <button class="btn">
      Login
    </button>

    <!-- CART -->

    <a href="cart.html" class="btn">

      Cart 🛒

      <span id="cart-count">0</span>

    </a>

  </div>

</header>

<!-- ================= NAVIGATION ================= -->

<nav class="category-bar">

  <a href="index.html">

</section>

<div class="contact-buttons">

  <a
    href="tel:+919159842232"

    📞 Call Us

    href="https://wa.me/919159842232?text=Hello%20I%20need%20help%20with%20flowers"

<!-- ================= SCRIPT ================= -->

<script src="script.js"></script>

<!-- ================= PAGE LOAD ================= -->

<script>

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      if (typeof updateCart === "function") {

        updateCart();
      }

      if (typeof renderCartPage === "function") {

        renderCartPage();
      }

      if (typeof fetchSheetData === "function") {

        fetchSheetData();
      }
    }
  );

</script>
